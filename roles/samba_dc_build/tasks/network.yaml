---
- name: Make sure /etc/network/interfaces loads files from interfaces.d
  ansible.builtin.lineinfile:
    path: /etc/network/interfaces
    line: source /etc/network/interfaces.d/*
    state: present
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Disable DHCP configuration in /etc/network/interfaces
  ansible.builtin.lineinfile:
    path: /etc/network/interfaces
    regexp: "^iface {{ samba_dc_build_ifname }} inet dhcp"
    line: "# iface {{ samba_dc_build_ifname }} inet dhcp"
    state: present
    backup: true
  notify: samba_ad_dc reboot

- name: Directory for network interface configuration
  ansible.builtin.file:
    path: "/etc/network/interfaces.d"
    owner: root
    group: root
    mode: "0750"
    state: directory

- name: "Configure the network interface {{ samba_dc_build_ifname }}"
  ansible.builtin.copy:
    dest: "/etc/network/interfaces.d/{{ samba_dc_build_ifname }}"
    content: |
      iface {{ samba_dc_build_ifname }} inet static
          address {{ samba_dc_build_address }}
          netmask {{ samba_dc_build_netmask }}
          gateway {{ samba_dc_build_gateway }}
          dns-nameservers {{ samba_dc_build_nameserver }}
          dns-search {{ samba_dc_build_search_domain }}
    owner: root
    group: root
    mode: "0644"
  notify: samba_ad_dc reboot

- name: Stop and mask systemd-resolved (incompatible with Samba AD DC DNS)
  ansible.builtin.systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
    masked: true
  failed_when: false

- name: Check the status of /etc/resolv.conf
  ansible.builtin.stat:
    path: /etc/resolv.conf
    follow: false # important to detect whether it is a symlink
  register: samba_dc_build_resolv_status

# Only the systemd-resolved symlink needs removing. Removing the file
# unconditionally would make this role report changed — and notify a reboot —
# on every single run.
- name: Remove /etc/resolv.conf if it is a symlink
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent
  when:
    - samba_dc_build_resolv_status.stat.exists
    - samba_dc_build_resolv_status.stat.islnk

- name: Set /etc/resolv.conf
  ansible.builtin.copy:
    dest: "/etc/resolv.conf"
    content: |
      search {{ samba_dc_build_search_domain }}
      nameserver {{ samba_dc_build_nameserver }}
    owner: root
    group: root
    mode: "0644"
  notify: samba_ad_dc reboot
